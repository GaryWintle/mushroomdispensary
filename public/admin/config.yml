backend:
  name: git-gateway
  repo: GaryWintle/mushroomdispensary
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/4a75a26a-1fa6-4d5e-bd29-0b7fe110bd6a/pkce
  auth_token_endpoint: /sites/4a75a26a-1fa6-4d5e-bd29-0b7fe110bd6a/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://mushroomdispensary.netlify.app

media_folder: public/images/products
public_folder: /images/products

collections:
  - name: "products"
    label: "Products"
    folder: "src/content/products"
    create: true
    slug: "{{slug}}"
    preview_path: "products/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Psilocybin Mushrooms", value: "psilocybin" }
          - { label: "LSD", value: "lsd" }
          - { label: "DMT", value: "dmt" }
          - { label: "Plant Medicine", value: "plant-medicine" }
          - { label: "Kratom", value: "kratom" }
          - { label: "Merchandise", value: "merchandise" }
      - label: "Experience Level"
        name: "experience"
        widget: "select"
        options:
          - { label: "Beginner-friendly", value: "beginner" }
          - { label: "Some experience needed", value: "intermediate" }
          - { label: "Experienced users only", value: "advanced" }
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Hero Image", name: "image", widget: "image" }
      - {
          label: "Safety Note",
          name: "safetyNote",
          widget: "string",
          required: false,
        }
      - {
          label: "Mail Order Available",
          name: "mailOrder",
          widget: "boolean",
          default: false,
        }
      - {
          label: "User Guide PDF",
          name: "userGuide",
          widget: "string",
          required: false,
        }
      - {
          label: "Display Order",
          name: "order",
          widget: "number",
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }
